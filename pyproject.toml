[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleatlas-python"
version = "0.0.1"
description = "Rule-based state transitions and outcomes for sports and games"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TODO_MAINTAINER" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruleatlas = ["data/rules/*.json", "data/catalog/*.json", "data/contracts/*.json", "data/profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
