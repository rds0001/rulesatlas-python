name: Publish rulesatlas to PyPI
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked distributions to PyPI
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-pypi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build and test tools
        run: python -m pip install 'setuptools>=77.0.0' wheel build twine pytest jsonschema
      - name: Build and check the exact release files
        run: |
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rulesatlas/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
